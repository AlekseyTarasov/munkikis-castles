; Munkiki's Castles engine for Lilka v2 (ESP32-S3).
; Build:  pio run          -> .pio/build/v2/firmware.bin
; Put firmware.bin and your own Munkiki.jar (or the .zip dump) in one folder on the SD card,
; then open the .bin from KeiraOS.

[platformio]
src_dir = ../src
boards_dir = boards
default_envs = v2

[env:v2]
platform = espressif32 @ 6.12.0
board = lilka_v2
framework = arduino
lib_deps =
	lilka/Lilka
build_src_filter = -<*> +<core/> +<platform/lilka/>
build_unflags = -std=gnu++11
build_flags =
	-std=gnu++17
	-O2
	-DLILKA_NO_BUZZER_HELLO
monitor_speed = 115200
